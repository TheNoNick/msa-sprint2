{{- if .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.appName }}
  labels:
    app: {{ .Values.appName }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      # префикс http — Istio понимает протокол и применяет HTTP-маршрутизацию
      name: http
  # без метки version: Service видит поды обеих версий, делит их уже Istio
  selector:
    app: {{ .Values.appName }}
{{- end }}
