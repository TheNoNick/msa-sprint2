apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: booking-feature-flag
  namespace: istio-system
spec:
  workloadSelector:
    labels:
      istio: ingressgateway
  configPatches:
    - applyTo: HTTP_ROUTE
      match:
        context: GATEWAY
        routeConfiguration:
          vhost:
            name: "*:80"
      patch:
        operation: INSERT_FIRST
        value:
          name: feature-flag-v2
          match:
            prefix: /
            headers:
              - name: x-feature-enabled
                string_match:
                  exact: "true"
          route:
            cluster: outbound|80|v2|booking-service.default.svc.cluster.local
          response_headers_to_add:
            - header:
                key: x-routed-by
                value: envoy-filter
