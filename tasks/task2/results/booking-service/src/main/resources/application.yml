spring:
  application:
    name: booking-service
  main:
    web-application-type: none
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/booking}
    username: ${DB_USER:booking}
    password: ${DB_PASSWORD:booking}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        max.block.ms: 5000

grpc:
  port: ${GRPC_PORT:9090}

monolith:
  url: ${MONOLITH_URL:http://localhost:8080}

booking:
  topic: booking.events
